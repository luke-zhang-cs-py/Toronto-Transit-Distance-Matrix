# Carried over from the previous version of this repo, where it was the
# stock "Python Package using Conda" starter. That template ran
# `conda env update --file environment.yml`, but this project has no
# environment.yml -- it uses requirements.txt -- so every run failed at the
# dependency step. It also ran pytest against a repo with no tests.
#
# Same intent, pointed at what actually exists here. It also ran pytest
# against a repo with no tests -- there are tests now, so that part is back.

name: Python Package

on: [push, pull_request]

jobs:
  build:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 19 October
    # 2026, and a runner image changing under the suite is a red build with
    # no code change behind it. Move this on purpose, with a green run.
    runs-on: ubuntu-24.04
    # The suite takes under a minute. A job stuck past this is not going to
    # finish, and failing it says so sooner than the six-hour default.
    timeout-minutes: 15
    strategy:
      # One Python failing should not cancel the other: both results matter,
      # since 3.10 and 3.12 break in different ways.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # Real errors only: syntax problems and undefined names.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Everything else is advisory.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        # Replaces the inline "does it import and produce a route" check that
        # used to sit here. The suite asserts the same thing and rather more:
        # that the graph is one connected network, that a trip's legs add up
        # to its own total, and that a malformed request is a 400.
        #
        # Note what this runner does not have: schedule_index.json is
        # gitignored derived data, so every run here takes the modelled-wait
        # path rather than the timetabled one. Boarding waits are longer,
        # which reorders the trip options -- driving comes first for trips
        # that transit wins locally. Three tests read options[0] as "the
        # transit trip" and were red here for six commits while green on a
        # machine that had the index built. If you are debugging a failure
        # that will not reproduce, build the index or move it aside.
        run: pytest -q
