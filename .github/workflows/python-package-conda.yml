# Carried over from the previous version of this repo, where it was the
# stock "Python Package using Conda" starter. That template ran
# `conda env update --file environment.yml`, but this project has no
# environment.yml -- it uses requirements.txt -- so every run failed at the
# dependency step. It also ran pytest against a repo with no tests.
#
# Same intent, pointed at what actually exists here.

name: Python Package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Real errors only: syntax problems and undefined names.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Everything else is advisory.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check the app imports and the graph builds
        run: |
          python -c "
          from network import nodes, adj
          from routing import compute_times, build_route
          assert len(nodes) > 0, 'no stops loaded'
          assert len(adj) > 0, 'no edges loaded'
          r = build_route(43.6452, -79.3806, 43.7615, -79.4111)
          assert r['segments'], 'route produced no segments'
          print(f'ok: {len(nodes)} stops, {sum(len(v) for v in adj.values()) // 2} edges')
          print(f'sample route: {r[\"total\"]:.1f} min over {len(r[\"segments\"])} segments')
          "
